name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Run test suite (deterministic engine — no API key)
        env:
          PEOPLEIQ_DATA_DIR: ${{ runner.temp }}/peopleiq-data
          PEOPLEIQ_ADMIN_PASSWORD: ci-test-password-123
        run: python -m pytest tests/ -q

  frontend-build:
    name: Frontend build (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install & build
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

  docker-image:
    name: Docker image builds & boots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image (same Dockerfile Railway/Render use)
        run: docker build -t peopleiq-test .

      - name: Boot the container and hit the health check
        run: |
          docker run -d --name piq -e PORT=8000 -e PEOPLEIQ_ADMIN_PASSWORD=ci-smoke-pass-123 -p 8000:8000 peopleiq-test
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health; then echo; echo "healthy"; exit 0; fi
            sleep 2
          done
          echo "container never became healthy"; docker logs piq; exit 1
