# Render blueprint — deploys the People IQ Recruiter Agent as a private web app.
#
# In Render:  New +  →  Blueprint  →  connect this repo  →  set the values it
# asks for (admin password)  →  Apply.  Render builds the Dockerfile, attaches a
# persistent disk for the data, and gives you a private https URL.
#
# The app is private by login. The "starter" plan is used because it supports a
# persistent disk (so candidate data survives restarts). To just try it for
# free, change plan to "free" and remove the `disk:` block — data then resets
# when the free instance sleeps.

services:
  - type: web
    name: peopleiq-recruiter-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: oregon            # change to singapore for lower latency in India
    healthCheckPath: /api/health
    autoDeploy: true          # redeploys on every push to the connected branch
    disk:
      name: peopleiq-data
      mountPath: /data
      sizeGB: 1
    envVars:
      # You set this once in the Render dashboard when applying the blueprint.
      - key: PEOPLEIQ_ADMIN_PASSWORD
        sync: false
      # Auto-generated by Render and kept secret — signs login sessions.
      - key: PEOPLEIQ_SECRET_KEY
        generateValue: true
      # Optional — add later to switch on full Claude screening.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PEOPLEIQ_MODEL
        value: claude-opus-4-8
      # Optional — add later to send real emails (else safe draft-only).
      - key: PEOPLEIQ_EMAIL_SENDING
        value: "false"
      - key: PEOPLEIQ_SMTP_HOST
        sync: false
      - key: PEOPLEIQ_SMTP_PORT
        value: "587"
      - key: PEOPLEIQ_SMTP_USER
        sync: false
      - key: PEOPLEIQ_SMTP_PASSWORD
        sync: false
      - key: PEOPLEIQ_SMTP_FROM
        value: talent@thepeopleiq.com
      - key: PEOPLEIQ_RETENTION_DAYS
        value: "365"
